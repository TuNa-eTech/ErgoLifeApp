# version: "3.8"
name: "ergolife"
services:
  postgres:
    image: postgres:15
    container_name: ergolife-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ergolife}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ergolife123}
      POSTGRES_DB: ${POSTGRES_DB:-ergolife_db}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ergolife} -d ${POSTGRES_DB:-ergolife_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ergolife-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
    container_name: ergolife-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ergolife}:${POSTGRES_PASSWORD:-ergolife123}@postgres:5432/${POSTGRES_DB:-ergolife_db}?schema=public
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-here}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-./ergolife-firebase-adminsdk.json}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ergolife-network
    command: sh -c "yarn prisma:migrate && node dist/src/main"
  landing-page:
    build:
      context: ../landing-page
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: ergolife-landing-page
    restart: unless-stopped
    ports:
      - "5175:3003"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3003', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ergolife-network
  
  cms:
    build:
      context: ../cms
      dockerfile: Dockerfile
    container_name: ergolife-cms
    restart: unless-stopped
    ports:
      - "${CMS_PORT:-5176}:3002"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ergolife-network
  
  adminer:
    image: adminer:latest
    container_name: ergolife-adminer
    restart: unless-stopped
    ports:
      - "5052:8082"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ergolife-network

networks:
  ergolife-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
